<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHOWCASE HUB — Booking Admin</title><link rel="stylesheet" href="/styles.css"><style>body{min-height:100vh;padding:30px;background:#06132e}.admin{max-width:1050px;margin:35px auto}.adminbox{background:#fff;color:#0b1d3e;border-radius:18px;padding:24px}.admin input{padding:12px;border:1px solid #ccd8e9;border-radius:8px;width:min(100%,400px)}.admin button{padding:10px 14px;border:0;border-radius:8px;background:#0874ef;color:#fff;font-weight:700;cursor:pointer}.tablewrap{overflow:auto;margin-top:20px}table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;padding:12px;border-bottom:1px solid #e5ebf3;vertical-align:top}th{background:#f3f7fd}.status{padding:5px 8px;border-radius:20px;background:#eaf2ff}.row-actions{display:flex;gap:5px;flex-wrap:wrap}.row-actions button{font-size:10px;padding:7px}.hint{font-size:12px;color:#66758e}.error{color:#bd3434}</style></head><body><div class="admin"><a class="brand" href="/"><span class="brand-mark">S</span><span>SHOWCASE <b>HUB</b><small>BOOKING ADMIN</small></span></a><div class="adminbox" style="margin-top:25px"><h1>Booking requests</h1><p class="hint">Enter the ADMIN_KEY configured on your server. Keep this key private.</p><input id="key" type="password" placeholder="Admin key" autocomplete="current-password"> <button id="load">Load bookings</button><p id="msg" class="hint" role="status"></p><div class="tablewrap"><table><thead><tr><th>Reference / Type</th><th>Client</th><th>Service</th><th>Requested slot</th><th>Details</th><th>Status / Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>
const key=document.getElementById('key'),msg=document.getElementById('msg'),rows=document.getElementById('rows');
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json','x-admin-key':key.value,...options.headers}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){msg.textContent='Loading…';try{const items=await api('/api/admin/bookings');rows.innerHTML='';for(const b of items){const tr=document.createElement('tr');const vals=[`${b.reference}<br><span class="hint">${b.kind}</span>`,`${b.name}<br>${b.email}<br>${b.phone}`,b.service,`${b.date}<br>${b.time}`,b.details||'—'];vals.forEach((v,i)=>{const td=document.createElement('td');td.innerHTML=i===0||i===1||i===3?v.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/&lt;br&gt;/g,'<br>'):v.replace(/</g,'&lt;').replace(/>/g,'&gt;');tr.appendChild(td)});const td=document.createElement('td');td.innerHTML=`<span class="status">${b.status}</span><div class="row-actions"><button data-s="confirmed">Confirm</button><button data-s="declined">Decline</button><button data-s="completed">Complete</button></div>`;td.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',async()=>{try{await api('/api/admin/bookings/'+encodeURIComponent(b.reference),{method:'PATCH',body:JSON.stringify({status:btn.dataset.s})});load()}catch(e){msg.textContent=e.message}}));tr.appendChild(td);rows.appendChild(tr)}msg.textContent=`Loaded ${items.length} booking request(s).`}catch(e){msg.textContent=e.message;msg.className='error'}}
document.getElementById('load').addEventListener('click',load);
</script></body></html>
